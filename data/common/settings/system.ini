[system]
language=en
font file=/sys/Fonts/Tahoma.kf
font smoothing=sbp
font height=9
speaker mute=off

[touchpad]
speed=100
; how far a finger must move before the pointer follows, in pad units;
; larger is steadier under a pressing finger, 0 turns the filter off
jitter=1
; the same, for a finger that landed on the button strip: it is pressing
; rather than steering there, so it needs a stricter margin
jitter_buttons=45
scroll_step=64
scroll_invert=0
tap_enable=1
tap_drag=1
right_click=1
button_zone=15
right_split=50

[mouse]
speed=4
acceleration=3
double_click_delay=64

[low-level]
LBA=off
PCI=on

;timeout in minutes
;program needs a full path
[screensaver]
timeout=10
program=/sys/demos/spiral
available=3d/crownscr|demos/web|demos/zeroline|demos/spiral|/kolibrios/demos/kmatrix

[style]
default_skin=/sys/default.skn
default_wallp=/sys/home.png
buttons_gradient=1
bg_program=/sys/media/kiv
bg_param=\T__/sys/home.png
